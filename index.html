<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="HackDesk: Collegiate Hackathon Posting & Verification Platform. Single record in, verified event presence out. Official event page, participant pass, live developer channel, selection mail, and submission guide.">
  <meta name="theme-color" content="#fbf9f5">
  <title>HackDesk — Collegiate Hackathon Posting & Verification Desk</title>

  <!-- Claude Typography: Editorial Serif + Humanist Sans + Monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=4.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23d97757%22/><text x=%2250%22 y=%2266%22 fill=%22%23ffffff%22 font-family=%22serif%22 font-weight=%22600%22 font-size=%2252%22 text-anchor=%22middle%22>H</text></svg>">
</head>
<body>
  <!-- Claude Frosted Warm Header -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="header-left">
        <a href="#/" class="brand-link" aria-label="HackDesk Home">
          <span class="brand-symbol">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </span>
          <span class="brand-title">HackDesk</span>
          <span class="brand-pill">Collegiate Hackathons</span>
        </a>
      </div>

      <div class="header-center">
        <!-- Hackathon Switcher -->
        <div class="event-picker-wrap">
          <label for="event-selector" class="sr-only">Choose Hackathon</label>
          <select id="event-selector" class="event-picker-select" aria-label="Choose Hackathon">
            <!-- Populated dynamically -->
          </select>
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btn-sound-toggle" class="btn-ghost sound-toggle" title="Toggle UI Audio Feedback" aria-label="Toggle UI Audio Feedback">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span id="sound-label">Audio: OFF</span>
        </button>

        <button type="button" id="btn-global-print" class="btn-ghost" title="Print Clean A4 Dossier">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          <span>Print A4</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Secondary Navigation: Claude Editorial Sub-Bar -->
  <nav class="sub-nav" role="navigation" aria-label="Screens Navigation">
    <div class="sub-nav-inner" id="nav-tabs-container">
      <a href="#/e/hackmalabar-2026" class="sub-link active" data-screen="public">Overview</a>
      <a href="#/e/hackmalabar-2026/pass" class="sub-link" data-screen="pass">Participant Pass</a>
      <a href="#/e/hackmalabar-2026/chat" class="sub-link" data-screen="chat">Organisers Channel</a>
      <a href="#/e/hackmalabar-2026/mail" class="sub-link" data-screen="mail">Selection Mail</a>
      <a href="#/e/hackmalabar-2026/brief" class="sub-link" data-screen="brief">Hackathon Guide</a>
    </div>
  </nav>

  <!-- Main Mount Point -->
  <main id="app-wrapper" role="main">
    <div id="content-mount" class="page-container" aria-live="polite">
      <!-- Populated dynamically by app.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner" id="footer-mount">
      <!-- Populated dynamically by app.js -->
    </div>
  </footer>

  <script src="app.js?v=4.0"></script>
</body>
</html>
