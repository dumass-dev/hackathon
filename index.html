<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Campus Proof Desk: a single record in, a complete publishable event presence out. Generates public page, pass, organisers chat, selection mail, calendar file and hostel leave brief.">
  <meta name="theme-color" content="#000000">
  <title>Campus Proof Desk — Event Presence & Leave Verification</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body>
  <!-- Global Top Header -->
  <header class="top-header" role="banner">
    <div class="top-bar-inner">
      <div class="brand-block">
        <a href="#/" class="brand-block" style="text-decoration:none;">
          <div class="brand-icon" aria-hidden="true">CP</div>
          <div class="brand-text">
            <h1>Campus Proof Desk</h1>
            <div class="brand-badge">Cross-Consistent Event Output</div>
          </div>
        </a>
      </div>

      <div class="top-actions">
        <!-- Event Switcher -->
        <label for="event-selector" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Select Event</label>
        <select id="event-selector" class="event-selector-select" aria-label="Select Event">
          <!-- Populated by app.js -->
        </select>

        <button type="button" id="btn-global-print" class="btn btn-outline" title="Print this screen cleanly at A4 with chrome stripped">
          🖨️ Print A4
        </button>

        <a href="#/admin" class="btn btn-secondary" title="Event Desk & Admin Editor">
          ⚙️ Admin
        </a>
      </div>
    </div>
  </header>

  <!-- Deep-Linkable Secondary Screen Navigation Tabs -->
  <nav class="screen-tabs-bar" role="navigation" aria-label="Event Presence Screens">
    <div class="screen-tabs-inner" id="nav-tabs-container">
      <a href="#/e/hackmalabar-2026" class="tab-link" data-screen="public">🏛️ Public Page</a>
      <a href="#/e/hackmalabar-2026/pass" class="tab-link" data-screen="pass">🎫 Participant Pass</a>
      <a href="#/e/hackmalabar-2026/chat" class="tab-link" data-screen="chat">💬 Organisers Chat</a>
      <a href="#/e/hackmalabar-2026/mail" class="tab-link" data-screen="mail">✉️ Selection Mail</a>
      <a href="#/e/hackmalabar-2026/brief" class="tab-link" data-screen="brief">📋 Leave Brief</a>
      <a href="#/admin" class="tab-link" data-screen="admin">⚙️ Event Desk</a>
    </div>
  </nav>

  <!-- Dynamic Content Wrapper with Per-Event Palette Custom Properties -->
  <main id="app-wrapper" role="main">
    <div id="content-mount" class="main-content" aria-live="polite">
      <div style="padding: 3rem 1rem; text-align: center; color: #94a3b8;">
        <p>Loading Campus Proof Desk verified event record...</p>
      </div>
    </div>
  </main>

  <!-- Footer with Cross-Consistent Contacts and Admin Link -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner" id="footer-mount">
      <!-- Populated dynamically by app.js -->
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
